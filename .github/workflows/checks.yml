name: Code checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Test AgentX against real network namespaces
        run: |
          ARTIFACTS="$RUNNER_TEMP/real-namespace-artifacts.json"
          BINARY_PATH="$RUNNER_TEMP/real-namespace-binary"
          cargo test --locked --test real_namespace --no-run --message-format=json > "$ARTIFACTS"
          jq --slurp --raw-output --exit-status '
            [
              .[]
              | select(
                  .reason == "compiler-artifact"
                  and .target.kind == ["test"]
                  and .target.name == "real_namespace"
                  and .executable != null
                )
              | .executable
            ]
            | if length == 1 then .[0] else error("expected one real_namespace test artifact") end
          ' "$ARTIFACTS" > "$BINARY_PATH"
          IFS= read -r TEST_BINARY < "$BINARY_PATH"
          test -x "$TEST_BINARY"
          docker build --tag agentx-ifstack-real-namespace --file .github/real-namespace.Dockerfile .github
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev \
            --cap-drop ALL \
            --cap-add SYS_ADMIN \
            --cap-add NET_ADMIN \
            --cap-add SETUID \
            --cap-add SETGID \
            --cap-add KILL \
            --security-opt no-new-privileges \
            --entrypoint "$TEST_BINARY" \
            --volume "$PWD:$PWD:ro" \
            --workdir "$PWD" \
            agentx-ifstack-real-namespace \
            --ignored
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Check packaging policy
        run: |
          python3 -m pip install PyYAML==6.0.3 pre-commit==4.5.1
          python3 packaging/test_policy.py

  # Dependabot raises version bumps. This reports whether the tree as locked carries a
  # known advisory, and whether a transitive crate brings a licence the packages cannot
  # ship. It runs beside `check` so it does not lengthen the critical path.
  deny:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  # Workflow-level audit: permissions, injection, unpinned actions. The other gates
  # look at the crate and the packages, not at the workflows themselves.
  zizmor:
    name: Workflow audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # advanced-security uploads SARIF and needs security-events: write, which a called
      # workflow cannot hold unless every caller grants it. The findings gate the job and
      # appear as annotations, so the upload buys nothing worth widening the callers for.
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          annotations: true
