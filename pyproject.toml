# Release tooling only. This repository builds a Rust binary; the Python project
# table is deliberately absent so nothing here is installable or importable.

[dependency-groups]
dev = ["python-semantic-release==10.5.1"]

[tool.semantic_release]
version_toml = ["Cargo.toml:package.version"]
branch = "main"
# Stay below 1.0 while the wire format settles: without this a feat: commit on a
# 0.x version jumps straight to 1.0.0 and declares a stable interface.
allow_zero_version = true
major_on_zero = false
commit_message = "chore(release): {version}\n\nAutomatically generated by python-semantic-release"
# The only hook between the version write and `git add`. Cargo.lock records this
# package's own version, and the Debian changelog carries it into the .deb, so both
# are rewritten here and listed in `assets` to join the release commit.
build_command = "sh packaging/release-build.sh"
assets = ["Cargo.lock", "packaging/changelog"]

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*.deb", "dist/*.rpm"]
upload_to_vcs_release = true

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "docs", "style", "refactor", "perf", "test", "build", "ci", "chore", "revert"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
parse_squash_commits = false
