# AgentX master Unix socket.
socket = "/var/agentx/master"

# Seconds between background complete inventories, at least 1.
reconcile = 3600

# AgentX registration priority, from 1 to 255; lower values win.
priority = 127

# Default stderr log filter: error, warn, info, debug, or trace.
# RUST_LOG overrides this filter.
log_level = "info"
