[package]
name = "agentx-ifstack"
version = "0.1.0"
edition = "2024"
description = "AgentX subagent serving IF-MIB ifStackTable for Linux bonds, bridges and VLANs"
license = "MIT OR Apache-2.0"
repository = "https://github.com/marcinpsk/agentx-ifstack"
readme = "README.md"
keywords = ["snmp", "agentx", "if-mib", "ifstacktable", "linux"]
categories = ["network-programming", "command-line-utilities"]

[dependencies]
agentx = "0.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
