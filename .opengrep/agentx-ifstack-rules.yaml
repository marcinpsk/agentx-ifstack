# Custom opengrep ruleset encoding this project's CLAUDE.md correctness invariants.
# These run ON TOP OF CodeRabbit's default opengrep packs: the file is intentionally
# NOT named opengrep.yml or semgrep.yml, because CodeRabbit treats such a file as its
# config and runs it INSTEAD OF its own packs. The local scan passes this file
# explicitly with --config, so the file name does not affect CodeRabbit.
#
# Rule-test fixtures live in .opengrep/tests/; run them with scripts/opengrep-test.sh.
rules:
  - id: agentx-unwrap-outside-tests
    languages: [rust]
    severity: ERROR
    message: >-
      unwrap panics, and a panic aborts the daemon while systemd counts the restart.
      Return an error, or use expect with a message when the invariant is local and
      genuinely cannot fail.
    metadata:
      category: reliability
      confidence: HIGH
      references:
        - "CLAUDE.md: validate at boundaries and fail fast, no silent panics"
    paths:
      exclude:
        - "tests/**"
    patterns:
      - pattern: $VALUE.unwrap()
      # The attribute makes a test module, not its name. `$_` matches any module name;
      # a named metavariable does not match a Rust module declaration here.
      - pattern-not-inside: |
          #[cfg(test)]
          mod $_ { ... }

  - id: agentx-stack-relationship-without-self-guard
    languages: [rust]
    severity: ERROR
    message: >-
      This stack relationship is built without rejecting a self reference first. RFC 2863
      has no row where an interface runs over itself, and Topology::from_observed rejects
      such an inventory. Reject higher == lower before the insert.
      Limit: this rule sees a missing guard, not a misplaced one. A guard nested inside a
      filter that skips some inputs still matches. The exhaustive self reference test in
      src/link.rs covers that case.
    metadata:
      category: correctness
      confidence: HIGH
      references:
        - "CLAUDE.md: reject remote and self lower-interface references"
        - "RFC 2863 ifStackTable: a sub-layer does not run over itself"
    paths:
      exclude:
        - "tests/**"
    patterns:
      - pattern: |
          StackRelationship { higher: $HIGHER, lower: $LOWER }
      # The guard may sit in an enclosing block, so the trailing ... spans nested blocks.
      - pattern-not-inside: |
          if $HIGHER == $LOWER { ... }
          ...
      - pattern-not-inside: |
          if $LOWER == $HIGHER { ... }
          ...
